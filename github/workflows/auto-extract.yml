
name: Auto Extract ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP archives
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=( *.zip )

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP files found."
            exit 0
          fi

          for archive in "${archives[@]}"; do
            echo "Extracting: $archive"

            mkdir -p /tmp/zip-extract
            rm -rf /tmp/zip-extract/*
            unzip -q "$archive" -d /tmp/zip-extract

            # Move extracted project contents into repository root.
            if [ -d /tmp/zip-extract ]; then
              find /tmp/zip-extract -mindepth 1 -maxdepth 1 \
                -exec cp -a -n {} . \;
            fi

            # Validate Android project before deleting archive.
            if ! find . -maxdepth 3 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit | grep -q .; then
              echo "Gradle settings file not found. ZIP preserved."
              exit 1
            fi

            if [ ! -f app/src/main/AndroidManifest.xml ]; then
              echo "AndroidManifest.xml missing. ZIP preserved."
              exit 1
            fi

            rm -f "$archive"
            echo "Successfully extracted and deleted: $archive"
          done

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project ZIP automatically"
          git push origin main
