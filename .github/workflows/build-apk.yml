name: Build and Verify Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Download dependencies, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go for the pinned Xray source
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Prepare custom Xray AAR cache directory
        run: mkdir -p app/libs

      - name: Restore custom Xray AAR cache
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: custom-xray-v26.10.21-1b1647cd-vless-trojan-plaintext-optin-v2-${{ runner.os }}

      - name: Build custom Xray AAR with scoped plaintext VLESS and Trojan support
        if: steps.xray-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v26.10.21 https://github.com/2dust/AndroidLibXrayLite.git "$RUNNER_TEMP/AndroidLibXrayLite"
          git clone --filter=blob:none https://github.com/XTLS/Xray-core.git "$RUNNER_TEMP/Xray-core"
          git -C "$RUNNER_TEMP/Xray-core" checkout 1b1647cd9ddf
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-xray-core.py" "$RUNNER_TEMP/Xray-core/infra/conf/xray.go"

          cd "$RUNNER_TEMP/AndroidLibXrayLite"
          go mod edit -replace=github.com/xtls/xray-core="$RUNNER_TEMP/Xray-core"
          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
          test -s libv2ray.aar
          cp -v libv2ray.aar "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"
          echo "Custom Xray AAR built with protocol-scoped VLESS and Trojan plaintext opt-ins only."



      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore persistent APK signing key (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            test -s my-upload-key.jks
            {
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
              echo "STORE_PASSWORD=$STORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent signing key restored."
          else
            echo "No persistent signing key configured; using temporary debug key."
          fi

      - name: Generate CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            test -s "$KEYSTORE_PATH"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Download and verify pinned VPN dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets

          test -s app/libs/libv2ray.aar
          echo "Custom Xray AAR SHA256:"
          sha256sum app/libs/libv2ray.aar

          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.3/hev-socks5-tunnel.aar" \
            --output app/libs/hev-socks5-tunnel.aar
          echo "ab6c581e6157680cfe5687ee7bbdcf95405c006c2db3701879ec44b9e5f83836  app/libs/hev-socks5-tunnel.aar" | sha256sum --check -

          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611162204/geoip.dat" \
            --output app/src/main/assets/geoip.dat
          echo "304ac8a1cbcc8166e4f5a4f32955e4d0fb77a1bd713583e371b30ee27f3659d8  app/src/main/assets/geoip.dat" | sha256sum --check -

          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611162204/geosite.dat" \
            --output app/src/main/assets/geosite.dat
          echo "0a254319dfa52f8ac7ec4475a310657b06fd6e2d7dca69d47a1c443664f6e04f  app/src/main/assets/geosite.dat" | sha256sum --check -

          echo "Downloaded dependencies:"
          ls -lh app/libs app/src/main/assets

      - name: Verify native libraries and Java bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xray-aar /tmp/hev-aar
          unzip -q app/libs/libv2ray.aar -d /tmp/xray-aar
          unzip -q app/libs/hev-socks5-tunnel.aar -d /tmp/hev-aar

          for abi in arm64-v8a armeabi-v7a; do
            test -s "/tmp/xray-aar/jni/$abi/libgojni.so"
            test -s "/tmp/hev-aar/jni/$abi/libhev-socks5-tunnel.so"
          done

          test -s /tmp/xray-aar/classes.jar
          test -s /tmp/hev-aar/classes.jar
          jar tf /tmp/xray-aar/classes.jar | grep -q 'libv2ray/CoreController.class'
          jar tf /tmp/hev-aar/classes.jar | grep -q 'hev/htproxy/TProxyService.class'
          test -s app/src/main/assets/geoip.dat
          test -s app/src/main/assets/geosite.dat
          echo "Both ARM ABIs, JNI bindings and routing databases verified."

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-contents.txt
          for entry in \
            "lib/arm64-v8a/libgojni.so" \
            "lib/arm64-v8a/libhev-socks5-tunnel.so" \
            "lib/armeabi-v7a/libgojni.so" \
            "lib/armeabi-v7a/libhev-socks5-tunnel.so" \
            "assets/geoip.dat" \
            "assets/geosite.dat"; do
            grep -Fq "$entry" /tmp/apk-contents.txt || {
              echo "APK is missing required entry: $entry"
              exit 1
            }
          done
          echo "APK passed native ABI and GeoIP/GeoSite packaging checks."
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: timeout 10m gradle --no-daemon :app:testDebugUnitTest

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && steps.unit_tests.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Custom Tunnel Pro build ${{ github.run_number }}
          body: |
            Automated Android build for commit ${{ github.sha }}.

            - Debug APK for ARM64 and ARMv7
            - Native Xray and HEV libraries verified
            - GeoIP and GeoSite assets verified
            - Unit tests passed
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Tunnel-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Report unit test failure
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit tests failed or exceeded the 10-minute limit. The debug APK artifact was uploaded separately." >> "$GITHUB_STEP_SUMMARY"
          exit 1
