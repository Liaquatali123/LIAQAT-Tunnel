name: Auto Extract ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/auto-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and validate ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No root ZIP archive found."
            exit 1
          fi

          for archive in "${archives[@]}"; do
            tmp="$(mktemp -d)"
            unzip -q "$archive" -d "$tmp"
            entries=("$tmp"/* "$tmp"/.[!.]*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              cp -a "${entries[0]}/." .
            else
              cp -a "$tmp/." .
            fi
            rm -rf "$tmp"

            test -f settings.gradle || test -f settings.gradle.kts || {
              echo "Gradle settings missing; ZIP preserved."
              exit 1
            }
            test -f app/src/main/AndroidManifest.xml || {
              echo "AndroidManifest.xml missing; ZIP preserved."
              exit 1
            }
            rm -f "$archive"
            echo "Extracted and validated $archive"
          done

      - name: Commit extracted source to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The default GITHUB_TOKEN cannot push workflow files.
          # Keep the bundled build workflow for a separate authorized commit.
          git reset -q -- .github/workflows/build-apk.yml || true
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Extract Android project ZIP automatically [skip ci]"
          git push origin HEAD:main
